// visualization_msgs/InteractiveMarkerControl.proto
//  Represents a control that is to be displayed together with an interactive marker
syntax = "proto3";

package visualization_msgs;

import "geometry_msgs/Quaternion.proto";
import "visualization_msgs/Marker.proto";

message InteractiveMarkerControl {
  //  Identifying string for this control.
  //  You need to assign a unique value to this to receive feedback from the GUI
  //  on what actions the user performs on this control (e.g. a button click).
  string name = 1;


  //  Defines the local coordinate frame (relative to the pose of the parent
  //  interactive marker) in which is being rotated and translated.
  //  Default: Identity
  geometry_msgs.Quaternion orientation = 2;


  //  Orientation mode: controls how orientation changes.
  //  INHERIT: Follow orientation of interactive marker
  //  FIXED: Keep orientation fixed at initial state
  //  VIEW_FACING: Align y-z plane with screen (x: forward, y:left, z:up).
  // const uint8 INHERIT = 0;
  // const uint8 FIXED = 1;
  // const uint8 VIEW_FACING = 2;

  uint32 orientation_mode = 3;

  //  Interaction mode for this control
  // 
  //  NONE: This control is only meant for visualization; no context menu.
  //  MENU: Like NONE, but right-click menu is active.
  //  BUTTON: Element can be left-clicked.
  //  MOVE_AXIS: Translate along local x-axis.
  //  MOVE_PLANE: Translate in local y-z plane.
  //  ROTATE_AXIS: Rotate around local x-axis.
  //  MOVE_ROTATE: Combines MOVE_PLANE and ROTATE_AXIS.
  // const uint8 NONE = 0;
  // const uint8 MENU = 1;
  // const uint8 BUTTON = 2;
  // const uint8 MOVE_AXIS = 3;
  // const uint8 MOVE_PLANE = 4;
  // const uint8 ROTATE_AXIS = 5;
  // const uint8 MOVE_ROTATE = 6;
  //  "3D" interaction modes work with the mouse+SHIFT+CTRL or with 3D cursors.
  //  MOVE_3D: Translate freely in 3D space.
  //  ROTATE_3D: Rotate freely in 3D space about the origin of parent frame.
  //  MOVE_ROTATE_3D: Full 6-DOF freedom of translation and rotation about the cursor origin.
  // const uint8 MOVE_3D = 7;
  // const uint8 ROTATE_3D = 8;
  // const uint8 MOVE_ROTATE_3D = 9;

  uint32 interaction_mode = 4;


  //  If true, the contained markers will also be visible
  //  when the gui is not in interactive mode.
  bool always_visible = 5;


  //  Markers to be displayed as custom visual representation.
  //  Leave this empty to use the default control handles.
  // 
  //  Note:
  //  - The markers can be defined in an arbitrary coordinate frame,
  //    but will be transformed into the local frame of the interactive marker.
  //  - If the header of a marker is empty, its pose will be interpreted as
  //    relative to the pose of the parent interactive marker.
  repeated visualization_msgs.Marker markers = 6;


  //  In VIEW_FACING mode, set this to true if you don't want the markers
  //  to be aligned with the camera view point. The markers will show up
  //  as in INHERIT mode.
  bool independent_marker_orientation = 7;


  //  Short description (< 40 characters) of what this control does,
  //  e.g. "Move the robot".
  //  Default: A generic description based on the interaction mode
  string description = 8;
}
