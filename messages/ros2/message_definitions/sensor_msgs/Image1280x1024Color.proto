// sensor_msgs/Image1280x1024Color.proto
// Fixed-resolution color variant of sensor_msgs/Image — 1280 × 1024.
// Matches the native sensor output of the HuaTeng GigE camera (RGB8).
// Suggested compile (RGB8, 3 bytes/pixel = 3932160):
//   sb message compile --iox2 --bytes-cap 3932160 sensor_msgs/Image1280x1024Color
syntax = "proto3";

package sensor_msgs;

import "std_msgs/Header.proto";

message Image1280x1024Color {
  std_msgs.Header header = 1;

  // Resolution is fixed at 1280x1024 by message type; kept here for
  // consumer convenience and parity with sensor_msgs.Image.
  uint32 height = 2;  // expected 1024
  uint32 width = 3;   // expected 1280

  string encoding = 4;  // expected RGB8
  uint32 is_bigendian = 5;
  uint32 step = 6;      // expected 3840 (width * 3)
  bytes data = 7;
}
