// sensor_msgs/NavSatStatus.proto
//  Navigation Satellite fix status for any Global Navigation Satellite System.
//
//  Whether to output an augmented fix is determined by both the fix
//  type and the last time differential corrections were received.  A
//  fix is valid when status >= STATUS_FIX.
syntax = "proto3";

package sensor_msgs;

message NavSatStatus {
  // const int8 STATUS_UNKNOWN = -2;  // status is not yet set
  // const int8 STATUS_NO_FIX = -1;  // unable to fix position
  // const int8 STATUS_FIX = 0;  // unaugmented fix
  // const int8 STATUS_SBAS_FIX = 1;  // with satellite-based augmentation
  // const int8 STATUS_GBAS_FIX = 2;  // with ground-based augmentation

  int32 status = 1;  // default=-2 | STATUS_UNKNOWN

  //  Bits defining which Global Navigation Satellite System signals were
  //  used by the receiver.

  // const uint16 SERVICE_UNKNOWN = 0;  // Remember service is a bitfield, so checking (service & SERVICE_UNKNOWN) will not work. Use == instead.
  // const uint16 SERVICE_GPS = 1;
  // const uint16 SERVICE_GLONASS = 2;
  // const uint16 SERVICE_COMPASS = 4;  // includes BeiDou.
  // const uint16 SERVICE_GALILEO = 8;

  uint32 service = 2;
}
