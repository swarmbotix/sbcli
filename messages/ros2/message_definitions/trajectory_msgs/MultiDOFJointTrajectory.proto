// trajectory_msgs/MultiDOFJointTrajectory.proto
//  The header is used to specify the coordinate frame and the reference time for the trajectory durations
syntax = "proto3";

package trajectory_msgs;

import "std_msgs/Header.proto";
import "trajectory_msgs/MultiDOFJointTrajectoryPoint.proto";

message MultiDOFJointTrajectory {
  std_msgs.Header header = 1;

  //  A representation of a multi-dof joint trajectory (each point is a transformation)
  //  Each point along the trajectory will include an array of positions/velocities/accelerations
  //  that has the same length as the array of joint names, and has the same order of joints as
  //  the joint names array.

  repeated string joint_names = 2;
  repeated trajectory_msgs.MultiDOFJointTrajectoryPoint points = 3;
}
