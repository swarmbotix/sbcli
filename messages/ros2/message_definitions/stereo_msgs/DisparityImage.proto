// stereo_msgs/DisparityImage.proto
//  Separate header for compatibility with current TimeSynchronizer.
//  Likely to be removed in a later release, use image.header instead.
syntax = "proto3";

package stereo_msgs;

import "sensor_msgs/Image.proto";
import "sensor_msgs/RegionOfInterest.proto";
import "std_msgs/Header.proto";

message DisparityImage {
  std_msgs.Header header = 1;

  //  Floating point disparity image. The disparities are pre-adjusted for any
  //  x-offset between the principal points of the two cameras (in the case
  //  that they are verged). That is: d = x_l - x_r - (cx_l - cx_r)
  sensor_msgs.Image image = 2;

  //  Stereo geometry. For disparity d, the depth from the camera is Z = fT/d.
  float f = 3;  // Focal length, pixels
  float t = 4;  // Baseline, world units

  //  Subwindow of (potentially) valid disparity values.
  sensor_msgs.RegionOfInterest valid_window = 5;

  //  The range of disparities searched.
  //  In the disparity image, any disparity less than min_disparity is invalid.
  //  The disparity search range defines the horopter, or 3D volume that the
  //  stereo algorithm can "see". Points with Z outside of:
  //      Z_min = fT / max_disparity
  //      Z_max = fT / min_disparity
  //  could not be found.
  float min_disparity = 6;
  float max_disparity = 7;

  //  Smallest allowed disparity increment. The smallest achievable depth range
  //  resolution is delta_Z = (Z^2/fT)*delta_d.
  float delta_d = 8;
}
