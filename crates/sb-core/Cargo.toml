[package]
name = "sb-core"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure-logic core for the swarmbotix sb CLI: topic naming, configs, transport enum. No IO."

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
