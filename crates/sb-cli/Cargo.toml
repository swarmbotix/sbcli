[package]
name = "sb-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The sb command-line tool — the forge's user-facing binary."

[[bin]]
name = "sb"
path = "src/main.rs"

[dependencies]
sb-core = { workspace = true }
