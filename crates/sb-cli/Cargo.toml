sb-workspace = { workspace = true }
sb-codegen = { workspace = true }
sb-pubsub = { workspace = true }
sb-discover = { workspace = true }
sb-listen = { workspace = true }
sb-launch = { workspace = true }
sb-gopro = { workspace = true }
sb-apps = { workspace = true }
sb-update = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
# Only for the startup log-level warm-up in main.rs — the actual iox2
# work lives in sb-discover / sb-listen / sb-launch.
iceoryx2 = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
dirs = { workspace = true }
